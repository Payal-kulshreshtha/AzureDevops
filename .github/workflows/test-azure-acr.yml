name: Test Azure OIDC and ACR

on:
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:
    test-acr:
        name: Test Azure and ACR 
        runs-on: ubuntu-latest

        environment: dev

        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            
            -   name: Azure Login using OIDC
                uses: azure/login@v2
                with:
                    client-id: ${{ vars.AZURE_CLIENT_ID }}
                    tenant-id: ${{ vars.AZURE_TENANT_ID }}
                    subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

            -   name: Verify Azure Subscription
                run: |
                    az account show

            -   name: Login to ACR
                run: |
                    az acr login --name "${{ vars.ACR_NAME }}"

            -   name: Verify ACR access
                run: |
                    az acr show \
                    --name "${{ vars.ACR_NAME }}"
                    --query "{name:name, loginServer:loginServer, sku:sku}" \
                    --output table